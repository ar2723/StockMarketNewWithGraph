# 로컬 개발용 DB/캐시. 저장소 루트에서:
#   docker compose -f infra/docker-compose.local.yml up -d
# 이미지 태그는 Testcontainers(backend/src/test/.../TestcontainersConfiguration)와 맞춘다.
name: stockgraph-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stockgraph
      POSTGRES_USER: stockgraph
      POSTGRES_PASSWORD: stockgraph
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockgraph -d stockgraph"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
