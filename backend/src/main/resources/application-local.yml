# 로컬 개발용 기본값. infra/docker-compose.local.yml 의 컨테이너와 맞춘다.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockgraph}
    username: ${DB_USERNAME:stockgraph}
    password: ${DB_PASSWORD:stockgraph}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

stockgraph:
  collector:
    enabled: ${STOCKGRAPH_COLLECTOR_ENABLED:true}
